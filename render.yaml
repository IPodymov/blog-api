services:
  - type: web
    name: blog-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerCommand: /bin/sh -c '/app/migrate && exec /app/api'
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VISITOR_SECRET
        sync: false
  - type: cron
    name: blog-api-maintenance
    runtime: docker
    plan: starter
    region: frankfurt
    schedule: "0 3 * * *"
    dockerCommand: /app/maintenance
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: blog-api
          envVarKey: DATABASE_URL
      - key: VISITOR_SECRET
        fromService:
          type: web
          name: blog-api
          envVarKey: VISITOR_SECRET
