name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l api cmd internal migrations)" || (gofmt -l api cmd internal migrations; exit 1)
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Build (Vercel flags)
        run: go build -buildvcs=false -trimpath -ldflags '-s -w' -o server ./cmd/api && go build ./cmd/migrate ./cmd/maintenance

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blog -d blog_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://blog:blog@localhost:5432/blog_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -race -count=1 -tags=integration ./...

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - run: npm run check:openapi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t blog-api:ci .
