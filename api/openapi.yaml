        "summary": "Зарегистрировать фактическое открытие",
        "description": "Без тела. Только опубликованная статья. Автор и администратор: counted=false. Один учитываемый просмотр на посетителя/статью за VIEW_INTERVAL (по умолчанию 30 минут); отклонённый дубль окно не продлевает. Конкурентные запросы защищены транзакцией. Для авторизованного посетителя используется ID аккаунта, для гостя — подписанный сервером случайный cookie blog_visitor. Невалидный cookie заменяется. IP не хранится в аналитике. Лимит 60 запросов/мин на сетевой адрес. События просмотров и уникальные посетители не равнозначны; уникальные посетители не рассчитываются.",
