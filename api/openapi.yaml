            "name": "blog_visitor",
            "in": "cookie",
            "required": false,
            "description": "Не задавайте вручную. Сервер выдаёт подписанный непрозрачный cookie: HttpOnly, SameSite=Lax, Path=/api/v1, Max-Age=31536000, Secure по конфигурации (true в production). Cross-origin same-site клиент использует credentials: include и разрешённый CORS origin. Cross-site cookie может блокироваться; такой хостинг не поддерживает точную гостевую дедупликацию. Удаление cookie и смена браузера создают нового посетителя. Первые параллельные запросы без cookie также могут посчитаться отдельно.",
